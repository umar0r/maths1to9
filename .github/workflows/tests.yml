# Runs all the Maths1to9 tests on GitHub's computers.
# A green tick on the branch or pull request means every test passed;
# a red cross means something failed (click it to see which test).
name: Tests

on:
  push:
    branches: ['codex/**']       # every push to a builder's branch
  pull_request:
    branches: [main]             # every pull request into main
  workflow_dispatch:             # a "Run workflow" button on the Actions tab

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node runs the tests. PHP serves the site for the browser tests
      # (it comes preinstalled on GitHub's Ubuntu computers).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: php --version

      - name: Install test tools
        run: npm ci

      - name: Install the test browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Maths and file checks
        run: npm test

      - name: Browser checks
        if: ${{ !cancelled() }}  # run even if the maths checks failed
        run: npm run test:ui
        env:
          PHP_BIN: php           # use Ubuntu's PHP instead of XAMPP's

      # If anything failed, keep Playwright's screenshots and traces so the
      # failure can be looked at (download from the run's Summary page).
      - name: Save browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/maths1to9-ui-results
          retention-days: 14
          if-no-files-found: ignore
